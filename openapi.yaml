                items:
                  $ref: '#/components/schemas/Alimento'
          description: ''
    post:
      operationId: alimentos_create
      tags:
      - alimentos
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlimentoRequest'
        required: true
      security:
