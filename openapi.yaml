  /api/restaurantes/{id}/:
    get:
      operationId: restaurantes_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Um valor inteiro único que identifica este restaurante.
        required: true
      tags:
      - restaurantes
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Restaurante'
          description: ''
    put:
      operationId: restaurantes_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Um valor inteiro único que identifica este restaurante.
        required: true
      tags:
      - restaurantes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestauranteRequest'
        required: true
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Restaurante'
          description: ''
    patch:
      operationId: restaurantes_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Um valor inteiro único que identifica este restaurante.
        required: true
      tags:
      - restaurantes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedRestauranteRequest'
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
