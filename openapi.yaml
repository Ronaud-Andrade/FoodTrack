openapi: 3.0.3
info:
  title: FoodTrack
  version: 1.0.0
  description: 'Envie Authorization: Token <chave>. A chave sai de POST /api/token/.
    Usuário comum só acessa o próprio restaurante. Superusuário administra todas as
    empresas.'
paths:
  /api/alertas/validade/:
    get:
      operationId: alertas_validade_list
      parameters:
      - in: query
        name: dias
        schema:
          type: integer
      tags:
      - alertas
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AlertaValidade'
          description: ''
  /api/alimentos/:
    get:
      operationId: alimentos_list
      tags:
      - alimentos
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
