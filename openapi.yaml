  /api/restaurantes/me/configuracao/:
    get:
      operationId: restaurantes_me_configuracao_retrieve
      tags:
      - restaurantes
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfiguracaoRestaurante'
          description: ''
    patch:
      operationId: restaurantes_me_configuracao_partial_update
      tags:
      - restaurantes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedConfiguracaoRestauranteRequest'
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfiguracaoRestaurante'
          description: ''
  /api/saude/:
    get:
      operationId: saude_retrieve
      tags:
      - saude
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Saude'
          description: ''
  /api/token/:
    post:
      operationId: token_create
      description: Troca usuário e senha pela chave enviada em Authorization.
      tags:
      - token
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AuthTokenRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AuthTokenRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/AuthTokenRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResposta'
          description: ''
  /api/usuarios/:
    get:
      operationId: usuarios_list
      tags:
      - usuarios
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Usuario'
          description: ''
    post:
      operationId: usuarios_create
      tags:
      - usuarios
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsuarioRequest'
        required: true
      security:
      - tokenAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
          description: ''
  /api/usuarios/{id}/:
