          description: ''
  /api/desperdicios/{id}/:
    get:
      operationId: desperdicios_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Um valor inteiro único que identifica este desperdicio.
        required: true
      tags:
      - desperdicios
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Desperdicio'
          description: ''
    put:
      operationId: desperdicios_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Um valor inteiro único que identifica este desperdicio.
        required: true
      tags:
      - desperdicios
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DesperdicioRequest'
        required: true
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Desperdicio'
          description: ''
    patch:
      operationId: desperdicios_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Um valor inteiro único que identifica este desperdicio.
        required: true
      tags:
      - desperdicios
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedDesperdicioRequest'
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Desperdicio'
          description: ''
    delete:
      operationId: desperdicios_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Um valor inteiro único que identifica este desperdicio.
        required: true
      tags:
      - desperdicios
      security:
      - tokenAuth: []
      responses:
        '204':
          description: No response body
  /api/estoques/:
    get:
      operationId: estoques_list
      tags:
      - estoques
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Estoque'
          description: ''
    post:
      operationId: estoques_create
      tags:
      - estoques
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EstoqueRequest'
        required: true
      security:
      - tokenAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Estoque'
          description: ''
  /api/estoques/{id}/:
    get:
      operationId: estoques_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Um valor inteiro único que identifica este estoque.
        required: true
      tags:
      - estoques
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Estoque'
          description: ''
    put:
      operationId: estoques_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Um valor inteiro único que identifica este estoque.
        required: true
      tags:
      - estoques
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EstoqueRequest'
        required: true
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Estoque'
          description: ''
    patch:
      operationId: estoques_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Um valor inteiro único que identifica este estoque.
        required: true
      tags:
      - estoques
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedEstoqueRequest'
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Estoque'
          description: ''
    delete:
      operationId: estoques_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Um valor inteiro único que identifica este estoque.
        required: true
      tags:
      - estoques
      security:
      - tokenAuth: []
      responses:
        '204':
          description: No response body
  /api/restaurantes/:
    get:
      operationId: restaurantes_list
      tags:
      - restaurantes
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Restaurante'
          description: ''
    post:
      operationId: restaurantes_create
      tags:
      - restaurantes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestauranteRequest'
        required: true
      security:
      - tokenAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Restaurante'
          description: ''
  /api/restaurantes/{id}/:
    get:
      operationId: restaurantes_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Um valor inteiro único que identifica este restaurante.
        required: true
      tags:
      - restaurantes
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Restaurante'
          description: ''
    put:
      operationId: restaurantes_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Um valor inteiro único que identifica este restaurante.
        required: true
      tags:
      - restaurantes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestauranteRequest'
        required: true
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Restaurante'
          description: ''
    patch:
      operationId: restaurantes_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Um valor inteiro único que identifica este restaurante.
        required: true
      tags:
      - restaurantes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedRestauranteRequest'
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Restaurante'
          description: ''
    delete:
      operationId: restaurantes_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Um valor inteiro único que identifica este restaurante.
        required: true
      tags:
      - restaurantes
      security:
      - tokenAuth: []
      responses:
        '204':
          description: No response body
  /api/token/:
    post:
      operationId: token_create
      description: Troca usuário e senha pela chave enviada em Authorization.
      tags:
      - token
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AuthTokenRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AuthTokenRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/AuthTokenRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResposta'
          description: ''
  /api/usuarios/:
    get:
      operationId: usuarios_list
      tags:
      - usuarios
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Usuario'
          description: ''
    post:
      operationId: usuarios_create
      tags:
      - usuarios
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsuarioRequest'
        required: true
      security:
      - tokenAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
          description: ''
  /api/usuarios/{id}/:
    get:
      operationId: usuarios_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Um valor inteiro único que identifica este user.
        required: true
      tags:
      - usuarios
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
          description: ''
    put:
      operationId: usuarios_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Um valor inteiro único que identifica este user.
        required: true
      tags:
      - usuarios
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsuarioRequest'
        required: true
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
          description: ''
    patch:
      operationId: usuarios_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Um valor inteiro único que identifica este user.
        required: true
      tags:
      - usuarios
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUsuarioRequest'
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
          description: ''
    delete:
      operationId: usuarios_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Um valor inteiro único que identifica este user.
        required: true
      tags:
      - usuarios
      security:
      - tokenAuth: []
      responses:
        '204':
          description: No response body
components:
  schemas:
    Alimento:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        nome:
          type: string
          maxLength: 150
        categoria:
          type: string
          maxLength: 60
        medida:
          type: string
          maxLength: 50
        restaurante:
          type: integer
      required:
      - categoria
      - id
      - medida
      - nome
      - restaurante
    AlimentoRequest:
      type: object
      properties:
        nome:
          type: string
          minLength: 1
          maxLength: 150
        categoria:
          type: string
          minLength: 1
          maxLength: 60
        medida:
          type: string
          minLength: 1
          maxLength: 50
        restaurante:
          type: integer
      required:
      - categoria
      - medida
      - nome
      - restaurante
    AuthTokenRequest:
      type: object
      properties:
        username:
          type: string
          writeOnly: true
          minLength: 1
          title: Nome de usuário
        password:
          type: string
          writeOnly: true
          minLength: 1
          title: Senha
      required:
      - password
      - username
    Desperdicio:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        descricao:
          type: string
          maxLength: 300
        quantidade:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
        data:
          type: string
          format: date
        estoque:
          type: integer
        usuario:
          type: integer
          readOnly: true
      required:
      - data
      - descricao
      - estoque
      - id
      - quantidade
      - usuario
    DesperdicioRequest:
      type: object
      properties:
        descricao:
          type: string
          minLength: 1
          maxLength: 300
        quantidade:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
        data:
          type: string
          format: date
        estoque:
          type: integer
      required:
      - data
      - descricao
      - estoque
      - quantidade
    Estoque:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        alimento:
          type: integer
        qntd_atual:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
        entrada:
          type: string
          format: date
        saida:
          type: string
          format: date
          nullable: true
        localizacao:
          type: string
          maxLength: 150
      required:
      - alimento
      - entrada
      - id
      - localizacao
      - qntd_atual
    EstoqueRequest:
      type: object
      properties:
        alimento:
          type: integer
        qntd_atual:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
        entrada:
          type: string
          format: date
        saida:
          type: string
          format: date
          nullable: true
        localizacao:
          type: string
          minLength: 1
          maxLength: 150
      required:
      - alimento
      - entrada
      - localizacao
      - qntd_atual
    PatchedAlimentoRequest:
      type: object
      properties:
        nome:
          type: string
          minLength: 1
          maxLength: 150
        categoria:
          type: string
          minLength: 1
          maxLength: 60
        medida:
          type: string
          minLength: 1
          maxLength: 50
        restaurante:
          type: integer
    PatchedDesperdicioRequest:
      type: object
      properties:
        descricao:
          type: string
          minLength: 1
          maxLength: 300
        quantidade:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
        data:
          type: string
          format: date
        estoque:
          type: integer
    PatchedEstoqueRequest:
      type: object
      properties:
        alimento:
          type: integer
        qntd_atual:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
        entrada:
          type: string
          format: date
        saida:
          type: string
          format: date
          nullable: true
        localizacao:
          type: string
          minLength: 1
          maxLength: 150
    PatchedRestauranteRequest:
      type: object
      properties:
        nome:
          type: string
          minLength: 1
          maxLength: 150
        cnpj:
          type: string
          minLength: 1
          maxLength: 18
    PatchedUsuarioRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 1
          title: Usuário
          description: Obrigatório. 150 caracteres ou menos. Letras, números e @/./+/-/_
            apenas.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        nome:
          type: string
          minLength: 1
          maxLength: 150
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
        perfil:
          type: string
          minLength: 1
          maxLength: 50
        restaurante:
          type: integer
          nullable: true
        is_superuser:
          type: boolean
          title: Status de superusuário
          description: Indica que este usuário tem todas as permissões sem atribuí-las
            explicitamente.
        password:
          type: string
          writeOnly: true
          minLength: 1
    Restaurante:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        nome:
          type: string
          maxLength: 150
        cnpj:
          type: string
          maxLength: 18
      required:
      - cnpj
      - id
      - nome
    RestauranteRequest:
      type: object
      properties:
        nome:
          type: string
          minLength: 1
          maxLength: 150
        cnpj:
          type: string
          minLength: 1
          maxLength: 18
      required:
      - cnpj
      - nome
    TokenResposta:
      type: object
      properties:
        token:
          type: string
      required:
      - token
    Usuario:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          title: Usuário
          description: Obrigatório. 150 caracteres ou menos. Letras, números e @/./+/-/_
            apenas.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        nome:
          type: string
          maxLength: 150
        email:
          type: string
          format: email
          maxLength: 254
        perfil:
          type: string
          maxLength: 50
        restaurante:
          type: integer
          nullable: true
        is_superuser:
          type: boolean
          title: Status de superusuário
          description: Indica que este usuário tem todas as permissões sem atribuí-las
            explicitamente.
      required:
      - email
      - id
      - nome
      - perfil
      - username
    UsuarioRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 1
          title: Usuário
          description: Obrigatório. 150 caracteres ou menos. Letras, números e @/./+/-/_
            apenas.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        nome:
          type: string
          minLength: 1
          maxLength: 150
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
        perfil:
          type: string
          minLength: 1
          maxLength: 50
        restaurante:
          type: integer
          nullable: true
        is_superuser:
          type: boolean
          title: Status de superusuário
          description: Indica que este usuário tem todas as permissões sem atribuí-las
            explicitamente.
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - email
      - nome
      - password
      - perfil
      - username
  securitySchemes:
    tokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Token-based authentication with required prefix "Token"
