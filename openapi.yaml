openapi: 3.0.3
info:
  title: FoodTrack
  version: 1.0.0
  description: 'Envie Authorization: Token <chave>. A chave sai de POST /api/token/.
    Usuário comum só acessa o próprio restaurante. Superusuário administra todas as
    empresas.'
paths:
  /api/alimentos/:
    get:
      operationId: alimentos_list
      tags:
      - alimentos
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Alimento'
          description: ''
    post:
      operationId: alimentos_create
      tags:
      - alimentos
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlimentoRequest'
        required: true
      security:
      - tokenAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Alimento'
          description: ''
  /api/alimentos/{id}/:
    get:
      operationId: alimentos_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Um valor inteiro único que identifica este alimento.
        required: true
      tags:
      - alimentos
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Alimento'
          description: ''
    put:
      operationId: alimentos_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Um valor inteiro único que identifica este alimento.
        required: true
      tags:
      - alimentos
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlimentoRequest'
        required: true
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Alimento'
          description: ''
    patch:
      operationId: alimentos_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Um valor inteiro único que identifica este alimento.
        required: true
      tags:
      - alimentos
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAlimentoRequest'
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Alimento'
          description: ''
    delete:
      operationId: alimentos_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Um valor inteiro único que identifica este alimento.
        required: true
      tags:
      - alimentos
      security:
      - tokenAuth: []
      responses:
        '204':
          description: No response body
  /api/desperdicios/:
    get:
      operationId: desperdicios_list
      tags:
      - desperdicios
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Desperdicio'
          description: ''
    post:
      operationId: desperdicios_create
      tags:
      - desperdicios
      requestBody:
        content:
          application/json:
