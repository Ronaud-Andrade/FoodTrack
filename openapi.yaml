                $ref: '#/components/schemas/Alimento'
          description: ''
    put:
      operationId: alimentos_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Um valor inteiro único que identifica este alimento.
        required: true
      tags:
      - alimentos
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlimentoRequest'
        required: true
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Alimento'
          description: ''
    patch:
      operationId: alimentos_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Um valor inteiro único que identifica este alimento.
        required: true
      tags:
      - alimentos
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAlimentoRequest'
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Alimento'
          description: ''
    delete:
      operationId: alimentos_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Um valor inteiro único que identifica este alimento.
        required: true
      tags:
      - alimentos
      security:
      - tokenAuth: []
      responses:
        '204':
          description: No response body
  /api/desperdicios/:
