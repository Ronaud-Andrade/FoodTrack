components:
  schemas:
    AlertaValidade:
      type: object
      properties:
        situacao:
          type: string
        mensagem:
          type: string
        dias_restantes:
          type: integer
        estoque:
          type: integer
        alimento:
          type: string
        validade:
          type: string
          format: date
        localizacao:
          type: string
        quantidade_atual:
          type: string
          format: decimal
          pattern: ^-?\d{0,7}(?:\.\d{0,3})?$
      required:
      - alimento
      - dias_restantes
      - estoque
      - localizacao
      - mensagem
      - quantidade_atual
      - situacao
      - validade
    Alimento:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        nome:
          type: string
          maxLength: 150
        categoria:
          type: string
          maxLength: 60
        medida:
          $ref: '#/components/schemas/MedidaEnum'
        restaurante:
          type: integer
      required:
      - categoria
      - id
      - medida
      - nome
      - restaurante
    AlimentoRequest:
      type: object
      properties:
        nome:
          type: string
          minLength: 1
          maxLength: 150
        categoria:
          type: string
          minLength: 1
          maxLength: 60
        medida:
          $ref: '#/components/schemas/MedidaEnum'
        restaurante:
          type: integer
      required:
      - categoria
      - medida
      - nome
      - restaurante
    AuthTokenRequest:
      type: object
      properties:
        username:
          type: string
          writeOnly: true
          minLength: 1
          title: Nome de usuário
        password:
          type: string
          writeOnly: true
          minLength: 1
          title: Senha
      required:
      - password
      - username
    ConfiguracaoRestaurante:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        nome:
          type: string
          readOnly: true
        dias_alerta_validade:
          type: integer
          maximum: 365
          minimum: 0
      required:
      - id
      - nome
    Desperdicio:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        motivo:
          $ref: '#/components/schemas/MotivoEnum'
        descricao:
          type: string
          maxLength: 300
        quantidade:
          type: string
          format: decimal
          pattern: ^-?\d{0,7}(?:\.\d{0,3})?$
        data:
          type: string
          format: date
        estoque:
          type: integer
        usuario:
          type: integer
          readOnly: true
      required:
      - data
      - estoque
      - id
      - quantidade
      - usuario
    DesperdicioRequest:
      type: object
      properties:
        motivo:
          $ref: '#/components/schemas/MotivoEnum'
        descricao:
          type: string
          maxLength: 300
        quantidade:
          type: string
          format: decimal
          pattern: ^-?\d{0,7}(?:\.\d{0,3})?$
        data:
          type: string
          format: date
        estoque:
          type: integer
      required:
      - data
      - estoque
      - quantidade
    Estoque:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        alimento:
          type: integer
        quantidade_atual:
          type: string
          format: decimal
          pattern: ^-?\d{0,7}(?:\.\d{0,3})?$
        entrada:
          type: string
          format: date
        saida:
          type: string
          format: date
          nullable: true
        localizacao:
          type: string
          maxLength: 150
        validade:
          type: string
          format: date
          nullable: true
      required:
      - alimento
      - entrada
      - id
      - localizacao
      - quantidade_atual
    EstoqueRequest:
      type: object
      properties:
        alimento:
          type: integer
        quantidade_atual:
          type: string
          format: decimal
          pattern: ^-?\d{0,7}(?:\.\d{0,3})?$
        entrada:
          type: string
          format: date
        saida:
          type: string
          format: date
          nullable: true
        localizacao:
          type: string
          minLength: 1
          maxLength: 150
        validade:
          type: string
          format: date
          nullable: true
      required:
      - alimento
      - entrada
      - localizacao
      - quantidade_atual
    GrupoRelatorio:
      type: object
      properties:
        chave:
          type: string
        rotulo:
          type: string
        registros:
          type: integer
        quantidade:
          type: string
        percentual:
          type: string
      required:
      - chave
      - percentual
      - quantidade
      - registros
      - rotulo
    MedidaEnum:
      enum:
      - Kg
      - g
      - L
      - ml
      - un
      - maço
      - caixa
      type: string
      description: |-
        * `Kg` - Kg
        * `g` - g
        * `L` - L
        * `ml` - ml
        * `un` - Unidade
        * `maço` - Maço
        * `caixa` - Caixa
    MotivoEnum:
      enum:
      - vencimento
      - armazenamento_inadequado
      - excesso_de_compra
      - excesso_de_producao
      - erro_de_preparo
      - outro
      type: string
      description: |-
        * `vencimento` - Vencimento
        * `armazenamento_inadequado` - Armazenamento inadequado
        * `excesso_de_compra` - Excesso de compra
        * `excesso_de_producao` - Excesso de produção
        * `erro_de_preparo` - Erro de preparo
        * `outro` - Outro
    MotivoOpcao:
      type: object
      properties:
        valor:
          type: string
        rotulo:
          type: string
      required:
